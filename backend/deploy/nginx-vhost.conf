# Reference nginx vhost for ai-image backend running on the same VPS.
# Copy to /etc/nginx/sites-available/ai.ashakita.net, symlink into
# /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# TLS certs assumed to be issued via certbot (Let's Encrypt). Run once:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d ai.ashakita.net
# Certbot will edit this file in-place to add the ssl_certificate lines and
# the HTTP→HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name ai.ashakita.net;

    # certbot will add a redirect to https here after issuing the cert.

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI generation can take 30–60s; raise timeouts above nginx defaults.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Allow input photo uploads up to 10 MB (Flutter compresses to ~2 MB,
        # but be generous).
        client_max_body_size 10m;
    }
}
