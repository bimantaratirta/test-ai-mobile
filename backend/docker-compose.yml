# VPS deployment for ai-image backend.
# Image is built locally on the VPS from ./Dockerfile (no external registry
# needed). Workflow on the VPS:
#   git pull && docker compose build && docker compose up -d
# Caddy handles TLS termination + auto-Let's-Encrypt certs.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-image-backend:local
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    # No public ports — Caddy is the only edge.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env   # provides DOMAIN + ACME_EMAIL referenced inside Caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
