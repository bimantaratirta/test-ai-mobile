# VPS deployment for ai-image backend.
# Image is built locally on the VPS from ./Dockerfile (no external registry
# needed). Workflow on the VPS:
#   git pull && docker compose build && docker compose up -d
#
# This compose file does NOT include a reverse proxy. The backend binds to
# 127.0.0.1:8080 on the host, and an external nginx (running on the host) is
# expected to terminate TLS and reverse-proxy to it. See `deploy/nginx-vhost.conf`
# for a reference server block.
#
# If you don't have nginx and want a single-container HTTPS stack, see the
# `Caddyfile` in this directory and add a `caddy` service back here.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-image-backend:local
    restart: unless-stopped
    env_file: .env
    ports:
      # Bind only to loopback — only the host's nginx talks to it.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
