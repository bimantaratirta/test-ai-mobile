name: Backend CI

on:
  push:
    branches: [main]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  pull_request:
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: backend

      - name: Unit tests
        working-directory: backend
        run: go test ./...

      - name: Integration tests
        working-directory: backend
        run: go test -tags=integration ./...

  # Build image on the VPS itself — no external registry needed.
  # On push to main, SSH in, git pull, rebuild, restart.
  # VPS_PROJECT_DIR must point at the repo's `backend/` directory
  # (e.g. /home/user/ai-mobile/test-ai-mobile/backend).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (build on VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_DIR }}
            git pull --ff-only
            sudo docker compose build
            sudo docker compose up -d
            sudo docker compose ps
